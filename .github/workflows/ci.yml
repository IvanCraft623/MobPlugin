name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHPStan, PHPUnit and spawn data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: 8.2
          install-path: ./bin

      - name: Install Composer dependencies
        id: install
        run: composer install --prefer-dist --no-interaction --no-progress

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php vendor/bin/phpstan.phar analyze --no-progress

      - name: PHPUnit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test

      # The pinned mojang/bedrock-samples dev dependency drives both the generated PHP
      # artifacts and the merged spawn data; see docs/spawning.md.
      - name: Generated schema artifacts match the pinned schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php tools/spawn-rules/generate-schema.php --check

      - name: spawn_rules.json and NOTICE.md match a merge of the pinned samples
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php tools/spawn-rules/compile.php --check

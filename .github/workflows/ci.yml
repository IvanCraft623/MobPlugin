name: CI

on:
  push:
    branches: [main, ng]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-style:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The fixer is pinned, so a newer version can't start flagging files nobody touched.
      - name: Set up PHP and PHP-CS-Fixer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.2
          tools: php-cs-fixer:3.95.27
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi

  checks:
    name: PHPStan, PHPUnit and generated data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: 8.4
          install-path: ./bin

      - name: Install Composer dependencies
        id: install
        run: composer install --prefer-dist --no-interaction --no-progress

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php vendor/bin/phpstan.phar analyze --no-progress

      - name: PHPUnit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test

      # Regenerating must not change, add or delete any committed file.
      - name: Generated data matches the pinned samples
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          composer generate-spawn-schema
          composer compile-spawn-rules
          composer generate-entity-data
          composer compile-loot-tables
          composer generate-bedrock-notice
          git add --all -- resources/bedrock src/IvanCraft623/MobPlugin/spawning/parse/schema src/IvanCraft623/MobPlugin/spawning/event/VanillaSpawnEvents.php src/IvanCraft623/MobPlugin/loot/VanillaLootTables.php src/IvanCraft623/MobPlugin/data/bedrock/EntityIds.php src/IvanCraft623/MobPlugin/data/bedrock/VanillaEntitySizes.php
          git diff --cached --exit-code -- resources/bedrock src/IvanCraft623/MobPlugin/spawning/parse/schema src/IvanCraft623/MobPlugin/spawning/event/VanillaSpawnEvents.php src/IvanCraft623/MobPlugin/loot/VanillaLootTables.php src/IvanCraft623/MobPlugin/data/bedrock/EntityIds.php src/IvanCraft623/MobPlugin/data/bedrock/VanillaEntitySizes.php

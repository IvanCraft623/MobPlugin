name: Spawn schemas drift gate

on:
  push:
  pull_request:

jobs:
  drift:
    name: Schema artifacts in sync
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: 8.2
          install-path: ./bin

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      # The committed spawn schemas under resources/spawning/schemas/ drive the
      # generated SpawnComponent/SpawnSchema artifacts. If Mojang added/renamed/removed
      # a component or envelope key, regeneration from the committed schemas diverges and
      # --check fails — see docs/spawning.md. Runs offline (no bedrock-samples clone).
      - name: Verify generated schema artifacts match committed schemas
        run: php tools/spawn-rules/generate-schema.php --samples-dir=resources/spawning/schemas --schema-version=1.21.50 --check